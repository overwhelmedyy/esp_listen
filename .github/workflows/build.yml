name: Build APK

# 推送到 main 分支时自动编译，并把 APK 发布到 Releases 页面。
# 也可以在 Actions 页面手动点 "Run workflow" 重新编译。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check transcripts.json
        run: python3 -c "import json;d=json.load(open('web_shared/transcripts.json',encoding='utf-8'));e=d['episodes'];print(len(e),'episodes OK')"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # 把错误原因写成注释，在 Actions 页面顶部直接可见
            msg=$( (grep -E "^e: |error:" build.log; grep -A10 "What went wrong" build.log) | head -20 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg:-see log}"
            exit 1
          fi

      - name: Verify APKs
        run: |
          python3 - <<'PY' || exit 1
          import sys, zipfile, os
          need = {
              "plain": ["assets/index.html", "assets/transcripts.json"],
              "study": ["assets/index.html", "assets/transcripts.json", "assets/lex.json", "assets/ann/1.json", "assets/align.json", "assets/conj.json", "assets/ai/1.json"],
          }
          for fl, files in need.items():
              apk = f"app/build/outputs/apk/{fl}/release/app-{fl}-release.apk"
              if not os.path.exists(apk):
                  print(f"::error::{apk} not found"); sys.exit(1)
              names = set(zipfile.ZipFile(apk).namelist())
              missing = [n for n in files if n not in names]
              if missing:
                  print(f"::error title=APK contents::{fl} missing {missing}"); sys.exit(1)
              print(f"::notice title={fl}::OK ({len(names)} entries)")
          PY

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/plain/release/app-plain-release.apk "out/esp_listen-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/study/release/app-study-release.apk "out/esp_listen_study-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: esp_listen-v1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 西语听力 v1.0.${{ github.run_number }}
          body: |
            自动编译自 ${{ github.sha }}。
            - esp_listen-….apk：西语听力（原版，只有音频 + 双语文本）
            - esp_listen_study-….apk：西语听力·注释（点词注释、性数颜色、手动对齐）
            两个可以同时安装；新版本直接覆盖安装，收听进度会保留。
          files: out/*.apk
          make_latest: true
