<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>西语听力</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --fg: #1f1d1a; --muted: #8a847b; --line: #e8e2d8;
    --accent: #c2410c; --accent-soft: #fde7da; --en: #6b665e; --panel: #ffffff;
    --ms: #1d4ed8; --fs: #dc2626; --mp: #0e7490; --fp: #c026d3;
    --g-line: #ea580c; --c-line: #16a34a; --od: rgba(34,197,94,.16); --oi: rgba(147,51,234,.16);
    --cur: #fff1b8; --target: #fde68a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --card: #211f1c; --fg: #ece8e1; --muted: #8f897f; --line: #34312c;
            --accent: #fb923c; --accent-soft: #3b2417; --en: #a39d93; --panel: #1e1c19;
            --ms: #60a5fa; --fs: #f87171; --mp: #22d3ee; --fp: #e879f9;
            --g-line: #fb923c; --c-line: #4ade80; --od: rgba(74,222,128,.18); --oi: rgba(192,132,252,.2);
            --cur: #4a3f17; --target: #5c4a12; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- 顶栏 ---------- */
  .bar { display: flex; align-items: center; gap: 4px; padding: 8px 8px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
  .bar h1 { font-size: 19px; margin: 0 0 0 6px; flex: 1; }
  .bar .title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .iconbtn { min-width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; font-weight: 600; }
  .iconbtn:active { background: var(--line); }
  .pill { padding: 0 12px; height: 34px; border-radius: 17px; border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- 列表页 ---------- */
  #folderRow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); flex: none; }
  #folderRow span { flex: 1; }
  #search { margin: 0 12px 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; flex: none; }
  #list { flex: 1; overflow-y: auto; padding: 0 12px 90px; }
  .ep { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .ep:active { background: var(--line); }
  .ep .num { font: 600 13px ui-monospace, monospace; color: var(--accent); width: 40px; flex: none; }
  .ep .t { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; }
  .ep .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ep .prog { height: 3px; background: var(--line); border-radius: 2px; width: 60px; overflow: hidden; }
  .ep .prog i { display: block; height: 100%; background: var(--accent); }
  .ep.noaudio .t { opacity: .5; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

  #mini { position: fixed; left: 10px; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  #mini .t { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #miniPlay { width: 48px; height: 48px; border-radius: 24px; background: var(--accent); color: #fff; font-size: 20px; }

  /* ---------- 文本 ---------- */
  #text { flex: 1; overflow-y: auto; padding: 14px 16px 30px; -webkit-overflow-scrolling: touch; }
  .para { margin: 0 0 18px; }
  .spk { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; letter-spacing: .02em; }
  .es { font-size: var(--fs-size, 19px); line-height: 1.85; }
  .en { font-size: calc(var(--fs-size, 19px) * .78); line-height: 1.5; color: var(--en); margin-top: 4px; }
  body.no-en .en { display: none; }
  .note { color: var(--muted); font-size: 14px; padding: 8px 0 16px; }
  .sent { border-radius: 4px; transition: background .25s; }
  #text { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 已对齐句子开头的小播放键 */
  .sp { display: none; vertical-align: 2px; width: 1.15em; height: 1.15em; margin-right: 3px; border-radius: 50%;
        background: var(--accent-soft); color: var(--accent); font-size: .62em; line-height: 1.15em; text-align: center; cursor: pointer; }
  body.l-sp .sent.done .sp { display: inline-block; }
  body.align .sent .sp { display: none !important; }
  .sp:active { background: var(--accent); color: #fff; }
  .sent.pressed { background: var(--target); }
  .sent.cur { background: var(--cur); }
  .w { cursor: pointer; border-radius: 3px; }
  .w.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 性数颜色：只给词尾上色 */
  body.l-gn .ms .e { color: var(--ms); font-weight: 600; }
  body.l-gn .fs .e { color: var(--fs); font-weight: 600; }
  body.l-gn .mp .e { color: var(--mp); font-weight: 600; }
  body.l-gn .fp .e { color: var(--fp); font-weight: 600; }
  /* 语法结构：橙色虚线下划线；固定搭配：绿色实线下划线 */
  body.l-g .w.g { text-decoration: underline dashed var(--g-line); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  body.l-c .w.c { text-decoration: underline solid var(--c-line); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  body.l-g.l-c .w.g.c { text-decoration: underline double var(--c-line); }
  /* 宾语：浅色底 */
  body.l-o .w.od { background: var(--od); }
  body.l-o .w.oi { background: var(--oi); }

  /* 对齐模式 */
  body.align .sent { cursor: pointer; }
  body.align .sent.done { box-shadow: inset 3px 0 0 var(--c-line); padding-left: 3px; }
  body.align .sent.target { background: var(--target); }

  /* ---------- 底部控制面板 ---------- */
  /* 控制区随字号缩放：默认字号 19px 时约 15px */
  #panel { flex: none; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 12px 8px;
           font-size: calc(var(--fs-size, 19px) * .78); }
  #seekRow { display: flex; align-items: center; gap: 8px; font: .78em ui-monospace, monospace; color: var(--muted); }
  #seek { flex: 1; accent-color: var(--accent); height: 24px; }
  #ctrlRow { display: flex; justify-content: space-between; align-items: center; margin: 2px 4px 6px; }
  .skip { width: 3em; height: 3em; border-radius: 1.5em; background: var(--card); border: 1px solid var(--line);
    display: grid; place-items: center; line-height: 1; font-size: 1em; font-weight: 700; }
  .skip:active, #play:active, #markBtn:active { transform: scale(.94); }
  #play { font-size: 1.35em; width: 2.6em; height: 2.6em; border-radius: 1.3em; background: var(--accent); color: #fff;
    box-shadow: 0 3px 10px rgba(194,65,12,.3); display: grid; place-items: center; }
  #speedRow { display: flex; gap: 5px; }
  #speedRow button { flex: 1; height: 2.1em; border-radius: 8px; border: 1px solid var(--line); font-size: .88em; font-weight: 600; }
  #speedRow button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #alignRow { display: none; gap: 5px; margin-bottom: 6px; align-items: stretch; }
  body.align #alignRow { display: flex; }
  #alignRow button { height: 2.4em; border-radius: 9px; border: 1px solid var(--line); font-size: .88em; font-weight: 600; padding: 0 .7em; }
  #markBtn { flex: 1; background: #16a34a !important; border-color: #16a34a !important; color: #fff; font-size: 1em !important; }
  #alignInfo { font-size: .75em; color: var(--muted); text-align: center; margin: 0 0 4px; display: none; }
  body.align #alignInfo { display: block; }

  /* ---------- 弹出卡片 ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--panel); border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.18); max-height: 62vh; overflow-y: auto; padding: 8px 18px 18px; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 10px; }
  .sheet h2 { margin: 0 0 2px; font-size: 22px; }
  .sheet h2 .lemma { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .sheet .sec { border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
  .sheet .lbl { font-size: 12px; font-weight: 700; letter-spacing: .03em; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .sheet .lbl i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
  .sheet .zh { font-size: 17px; line-height: 1.5; }
  .sheet .en2 { font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
  .sheet .desc { font-size: 15px; line-height: 1.55; white-space: pre-line; }
  .sheet .ttl { font-weight: 600; font-size: 15px; }
  .sheet .acts:empty { display: none; }
  .sheet .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .sheet .acts button { flex: 1; min-width: 120px; height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .sheet .acts button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; gap: 12px; }
  .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .switch { width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 23px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; margin-top: 4px; }
  .legend span b { font-weight: 700; }
  textarea { width: 100%; height: 120px; font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }

  /* 变位表 */
  .cj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
  .cj { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--card); }
  .cj b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 3px; }
  .cj div { font-size: 14px; line-height: 1.55; display: flex; gap: 6px; }
  .cj div i { font-style: normal; color: var(--muted); font-size: 11px; width: 52px; flex: none; padding-top: 2px; }
  .cj div.hit { background: var(--target); border-radius: 4px; font-weight: 700; }
  .cj-h { font-size: 13px; font-weight: 700; margin: 14px 0 0; color: var(--muted); letter-spacing: .03em; }
  .sheet a { color: var(--accent); }
  #msg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(0,0,0,.78); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 15px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 30; max-width: 80vw; text-align: center; }
  #msg.show { opacity: 1; }
</style>
</head>
<body>

<!-- ========== 剧集列表 ========== -->
<section id="listScreen" class="screen">
  <div class="bar">
    <h1>西语听力</h1>
    <button class="iconbtn" id="listSettings" aria-label="设置">⚙</button>
  </div>
  <div id="folderRow">
    <span id="folderInfo">还没有选择音频文件夹</span>
    <button class="pill" id="pickBtn">选择音频文件夹</button>
  </div>
  <input id="search" type="search" placeholder="搜索标题或集数…" autocomplete="off">
  <div id="list"></div>
  <div id="mini" class="hidden">
    <div class="t" id="miniTitle"></div>
    <button id="miniPlay">▶</button>
  </div>
  <input type="file" id="dirInput" webkitdirectory multiple class="hidden">
  <input type="file" id="importInput" accept=".json,application/json" class="hidden">
</section>

<!-- ========== 播放页 ========== -->
<section id="playerScreen" class="screen hidden">
  <div class="bar">
    <button class="iconbtn" id="backBtn" aria-label="返回">←</button>
    <div class="title" id="pTitle"></div>
    <button class="pill" id="alignBtn">对齐</button>
    <button class="iconbtn" id="settingsBtn" aria-label="设置">⚙</button>
  </div>
  <div id="text"></div>
  <div id="panel">
    <div id="alignInfo"></div>
    <div id="alignRow">
      <button id="markBtn">标记 ▸</button>
      <button id="nudgeBack">−0.2s</button>
      <button id="nudgeFwd">+0.2s</button>
      <button id="undoBtn">撤销</button>
    </div>
    <div id="seekRow">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="dur">0:00</span>
    </div>
    <div id="ctrlRow">
      <button class="skip" data-skip="-10">«10'</button>
      <button class="skip" data-skip="-5">‹5'</button>
      <button id="play" aria-label="播放/暂停">▶</button>
      <button class="skip" data-skip="5">5'›</button>
      <button class="skip" data-skip="10">10'»</button>
    </div>
    <div id="speedRow"></div>
  </div>
</section>

<div id="sheetBg" class="sheet-bg hidden"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="msg"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const SPEEDS = [0.75, 0.85, 1, 1.15, 1.25, 1.5];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let EPISODES = [];
let LEX = null;               // 词表（lex.json），第一次打开注释时加载
let audioByYt = {};
let current = null;           // 当前剧集
let ann = null;               // 当前剧集的注释数据
let AI = null;                // 精讲（老师式注释）：ai/<n>.json
let sentences = [];           // 当前剧集的句子：[{p, t0, t1, el}]
let st = { pos: 0, dur: 0, playing: false };
let seeking = false;
let curSent = -1;

/* ======================================================================
 * 播放器适配层：app 里用原生播放器（window.Android），浏览器里用 <audio>
 * ==================================================================== */
const native = window.Android && typeof window.Android.load === 'function';
const player = native ? {
  pick() { Android.pickFolder(); },
  list() { try { return JSON.parse(Android.listAudio() || '[]'); } catch { return []; } },
  load(file, startMs) { Android.load(file, Math.round(startMs)); },
  toggle() { Android.toggle(); },
  play() { Android.play(); },
  pause() { Android.pause(); },
  seekTo(ms) { Android.seekTo(Math.round(ms)); },
  seekBy(ms) { Android.seekBy(Math.round(ms)); },
  speed(x) { Android.setSpeed(x); },
  state() { try { return JSON.parse(Android.state()); } catch { return null; } },
  folderName() { try { return Android.folderName() || ''; } catch { return ''; } },
} : (() => {
  const au = new Audio(); let files = [];
  au.preservesPitch = true;
  return {
    pick() { $('dirInput').click(); },
    setFiles(fs) { files = fs; },
    list() { return files.map(f => ({ name: f.name })); },
    load(entry, startMs) {
      const f = files.find(x => x.name === entry);
      if (!f) return;
      if (au.src) URL.revokeObjectURL(au.src);
      au.src = URL.createObjectURL(f);
      au.addEventListener('loadedmetadata', () => { au.currentTime = startMs / 1000; au.play().catch(() => {}); }, { once: true });
    },
    toggle() { au.paused ? au.play().catch(() => {}) : au.pause(); },
    play() { au.play().catch(() => {}); },
    pause() { au.pause(); },
    seekTo(ms) { au.currentTime = Math.max(0, ms / 1000); },
    seekBy(ms) { au.currentTime = Math.max(0, Math.min(au.duration || 0, au.currentTime + ms / 1000)); },
    speed(x) { au.playbackRate = x; },
    state() { return { pos: au.currentTime * 1000, dur: (au.duration || 0) * 1000, playing: !au.paused }; },
    folderName() { return files.length ? '已选择的文件夹' : ''; },
  };
})();

$('dirInput').addEventListener('change', e => {
  player.setFiles([...e.target.files].filter(f => /\.(mp3|m4a|aac|ogg|opus|wav)$/i.test(f.name)));
  refreshAudio();
});
window.onFolderPicked = () => refreshAudio();
window.onPlayerEvent = ev => {
  if (ev === 'completed') saveProgress(true);
  if (ev && ev.startsWith && ev.startsWith('error')) toast('无法播放：' + ev.slice(6));
};

function refreshAudio() {
  audioByYt = {};
  let n = 0;
  for (const f of player.list()) {
    const m = f.name.match(/\[([A-Za-z0-9_-]{11})\]\.[a-z0-9]+$/i);
    if (m) { audioByYt[m[1]] = f.name; n++; }
  }
  const fname = player.folderName();
  const matched = EPISODES.filter(e => e.yt && audioByYt[e.yt]).length;
  $('folderInfo').textContent = n
    ? `${fname ? fname + '：' : ''}找到 ${n} 个音频，匹配 ${matched} 集`
    : (fname ? `${fname}：没有找到音频文件` : '还没有选择音频文件夹');
  $('pickBtn').textContent = n ? '更换文件夹' : '选择音频文件夹';
  renderList();
}

/* ======================================================================
 * 列表页
 * ==================================================================== */
const pad = n => 'E' + String(n).padStart(3, '0');
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmt1 = ms => { const s = Math.max(0, ms / 1000); return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`; };

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const prog = store.get('progress', {});
  const align = store.get('align', {});
  const frag = document.createDocumentFragment();
  for (const e of EPISODES) {
    const label = pad(e.n) + ' ' + e.title;
    if (q && !label.toLowerCase().includes(q) && String(e.n) !== q) continue;
    const has = e.yt && audioByYt[e.yt];
    const p = prog[e.n];
    const div = document.createElement('div');
    div.className = 'ep' + (has ? '' : ' noaudio');
    div.innerHTML = `<div class="num">${pad(e.n)}</div><div class="t"><div></div><div class="meta"></div></div>`;
    div.querySelector('.t div').textContent = e.title || '(无标题)';
    const meta = div.querySelector('.meta');
    if (e.kind === 'exercise') meta.insertAdjacentHTML('beforeend', '<span class="tag">只有练习题</span>');
    const al = align[e.n] || (BUILTIN_ALIGN[e.n] && BUILTIN_ALIGN[e.n]);
    if (al && al.filter(x => x != null).length) meta.insertAdjacentHTML('beforeend', '<span class="tag">已对齐</span>');
    if (!has) meta.insertAdjacentHTML('beforeend', '<span>无音频</span>');
    if (p && p.dur) {
      const pct = p.done ? 100 : Math.min(100, Math.round(p.pos / p.dur * 100));
      meta.insertAdjacentHTML('beforeend', `<span class="prog"><i style="width:${pct}%"></i></span><span>${p.done ? '已听完' : fmt(p.pos) + ' / ' + fmt(p.dur)}</span>`);
    }
    div.onclick = () => openEpisode(e);
    frag.append(div);
  }
  $('list').replaceChildren(frag);
}
$('search').addEventListener('input', renderList);
$('pickBtn').onclick = () => player.pick();

/* ======================================================================
 * 对齐数据：每集一个数组，按句子顺序存开始时间（毫秒），没标的是 null
 * 优先用本机标注，没有的话用打包进 app 的（web/align.json）
 * ==================================================================== */
let BUILTIN_ALIGN = {};
function getAlign(n) {
  const a = store.get('align', {})[n];
  return a ? a.slice() : (BUILTIN_ALIGN[n] ? BUILTIN_ALIGN[n].slice() : []);
}
function setAlign(n, arr) {
  const all = store.get('align', {});
  all[n] = arr.map(x => x == null ? null : Math.round(x));
  store.set('align', all);
}

/* ======================================================================
 * 播放页：渲染文本
 * ==================================================================== */
async function openEpisode(e) {
  const file = e.yt && audioByYt[e.yt];
  const sameAsPlaying = current && current.n === e.n;
  if (current && !sameAsPlaying) saveProgress(false);
  current = e;
  $('pTitle').textContent = pad(e.n) + ' ' + e.title;
  showPlayer(true);
  await renderText(e);
  if (!sameAsPlaying) {
    if (file) {
      const p = store.get('progress', {})[e.n];
      const start = p && !p.done ? Math.max(0, p.pos - 2000) : 0;
      player.load(file, start);
      player.speed(store.get('speed', 1));
    } else {
      toast('这一集没有找到音频文件');
    }
    store.set('last', e.n);
  }
}

async function loadJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function renderText(e) {
  const box = $('text');
  box.replaceChildren();
  ann = null; AI = null; sentences = []; curSent = -1;
  try {
    if (!LEX) LEX = await loadJSON('lex.json');
    ann = await loadJSON(`ann/${e.n}.json`);
  } catch (err) { ann = null; }
  try { AI = await loadJSON(`ai/${e.n}.json`); } catch (err) { AI = null; }

  if (e.kind === 'exercise') {
    const n = document.createElement('div'); n.className = 'note';
    n.textContent = '这一集的 PDF 只有练习题，没有逐字稿：';
    box.append(n);
  }
  const frag = document.createDocumentFragment();
  e.paras.forEach((p, pi) => {
    const d = document.createElement('div'); d.className = 'para';
    if (p.s) { const s = document.createElement('div'); s.className = 'spk'; s.textContent = p.s; d.append(s); }
    const es = document.createElement('div'); es.className = 'es';
    const ap = ann && ann.paras[pi];
    if (ap) {
      es.innerHTML = renderPara(ap, pi);
      es.querySelectorAll('.sent').forEach(el => { sentences[+el.dataset.s].el = el; });
    } else {
      es.textContent = p.es;
    }
    d.append(es);

    frag.append(d);

  requestAnimationFrame(() => { box.scrollTop = y; });
  updateAlignUI();
}

/** 一段 → HTML：按句子包 <span class="sent">，每个词包 <span class="w"> */
function renderPara(ap, pi) {
  const starts = new Set(ap.s);
  let html = '', open = false;
  ap.t.forEach((t, ti) => {
    if (starts.has(ti)) {
      if (open) html += '</span>';
      const si = sentences.length;
      sentences.push({ p: pi, t0: ti });
      html += `<span class="sent" data-s="${si}"><span class="sp" data-play="${si}">▶</span>`;
      open = true;
    }
    const [text, ws, info] = t;
    if (info) {
      const cls = ['w'];
      if (info.c) cls.push(info.c);
      if (info.o) cls.push(info.o);
      if (info.g) {
        if (info.g.some(g => ann.notes[g].k === 'g')) cls.push('g');
        if (info.g.some(g => ann.notes[g].k === 'c')) cls.push('c');
      }
      html += `<span class="${cls.join(' ')}" data-i="${pi}:${ti}">${info.c ? splitEnding(text) : esc(text)}</span>`;
    } else if (/\p{L}/u.test(text)) {
      html += `<span class="w" data-i="${pi}:${ti}">${esc(text)}</span>`;
    } else {
      html += esc(text);
    }
    if (ws) html += ' ';
  });
  if (open) html += '</span>';
  return html;
}

/** 把词尾（-o/-a/-os/-as/-es/-s）包起来，用于性数上色；没有典型词尾就整个词上色 */
function splitEnding(text) {
  const m = text.match(/^(.*?)(os|as|es|o|a|e|s)$/i);
  if (m && m[1].length >= 1) return esc(m[1]) + `<span class="e">${esc(m[2])}</span>`;
  return `<span class="e">${esc(text)}</span>`;
}

let lastWord = null;
function showWord(pi, ti, el) {
  lastWord = { pi, ti, el };
  document.querySelectorAll('.w.sel').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  const [text, , info = {}] = ann.paras[pi].t[ti];
  const lx = info.l != null && LEX ? LEX[info.l] : null;
  let h = '<div class="grab"></div>';
  h += `<h2>${esc(text)}${lx && lx.w.toLowerCase() !== text.toLowerCase() ? `<span class="lemma">base form: ${esc(lx.w)}</span>` : ''}</h2>`;
  if (lx) {
    h += `<div class="sec" style="border:0;margin-top:2px;padding-top:4px"><div class="lbl" style="color:var(--muted)">${esc(lx.p || '')}${lx.g ? ' · ' + esc(lx.g) : ''}</div>`;
    if (lx.zh) h += `<div class="zh">${esc(lx.zh)}</div>`;
    if (lx.en) h += `<div class="en2">${esc(lx.en)}</div>`;
    h += '</div>';
  }
  const si0 = sentenceOf(pi, ti);
  const tn = aiNotesFor(si0, pi, ti, text, lx ? lx.w : '');
  if (tn) h += tn.html;
  if (info.v) {
    const [main, hint] = info.v.split('\n');
    h += `<div class="sec"><div class="lbl">Verb form</div><div class="ttl">${esc(main)}</div>${hint ? `<div class="desc" style="color:var(--muted);font-size:14px">${esc(hint)}</div>` : ''}`;
    if (lx && lx.p === 'verb') h += `<div class="acts" style="margin-top:8px"><button data-act="conj" data-verb="${esc(lx.w)}" data-form="${esc(text)}">Conjugation table: ${esc(lx.w)} →</button></div>`;
    h += '</div>';
  }
  if (info.c) {
    const names = { ms: 'masculine · singular', fs: 'feminine · singular', mp: 'masculine · plural', fp: 'feminine · plural' };
    h += `<div class="sec"><div class="lbl"><i style="background:var(--${info.c})"></i>Gender &amp; number</div><div class="desc">${names[info.c]}</div></div>`;
  }
  if (info.o && !(tn && tn.hasO)) {
    h += `<div class="sec"><div class="lbl"><i style="background:var(--${info.o})"></i>${info.o === 'od' ? 'Direct object' : 'Indirect object'}</div><div class="desc">${esc(info.r || '')}</div></div>`;
  }
  for (const g of (tn ? [] : info.g || [])) {
    const n = ann.notes[g];
    const color = n.k === 'g' ? 'var(--g-line)' : 'var(--c-line)';
    h += `<div class="sec"><div class="lbl"><i style="background:${color}"></i>${n.k === 'g' ? 'Grammar' : 'Expression'}</div><div class="ttl">${esc(n.t)}</div><div class="desc">${esc(n.d)}</div></div>`;
  }
  const si = sentenceOf(pi, ti);
  const al = getAlign(current.n);
  h += '<div class="acts">';
  if (AI && AI.s[si]) h += `<button data-act="aiSent" data-s="${si}">Whole sentence notes</button>`;
  h += `</div>`;
  openSheet(h);
}

/* ---------- 精讲：把老师式注释对到点中的词 ---------- */
const lc = x => (x || '').toLowerCase().normalize('NFC');
const bare = x => lc(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function sentTokens(si) {
  const s = sentences[si]; if (!s) return [];
  const nx = sentences[si + 1];
  const toks = ann.paras[s.p].t;
  const end = nx && nx.p === s.p ? nx.t0 : toks.length;
  return toks.slice(s.t0, end).map((t, k) => ({ text: t[0], ti: s.t0 + k }));
}
function sentText(si) { const s = sentences[si]; if (!s) return ''; const nx = sentences[si + 1]; const toks = ann.paras[s.p].t; const end = nx && nx.p === s.p ? nx.t0 : toks.length; return toks.slice(s.t0, end).map(t => t[0] + (t[1] ? ' ' : '')).join('').trim(); }
const hasWord = (phrase, w) => bare(phrase).split(/[\s'’]+/).includes(bare(w));
function aiSec(lbl, color, ttl, desc) {
  return `<div class="sec ai"><div class="lbl"><i style="background:${color}"></i>${lbl}</div>${ttl ? `<div class="ttl">${esc(ttl)}</div>` : ''}${desc ? `<div class="desc">${esc(desc)}</div>` : ''}</div>`;
}
function aiNotesFor(si, pi, ti, text, lemma) {
  const n = AI && AI.s[si]; if (!n) return null;
  const w = lc(text);
  // 同一句里同一个词出现第几次（用来区分两个 te / me）
  const occ = sentTokens(si).filter(t => t.ti < ti && lc(t.text) === w).length;
  let h = `<div class="sec ai" style="border-top:2px solid var(--accent)"><div class="lbl" style="color:var(--accent)">Teacher notes · sentence translation</div><div class="desc">${esc(n.tr)}</div></div>`;
  let hit = false, hasO = false;
  for (const [word, base, mean] of n.k || []) if (hasWord(word, w) || (lemma && (lc(base) === lc(lemma) || lc(word) === lc(lemma)))) { h += aiSec('Meaning here', 'var(--muted)', `${word}${base && lc(base) !== lc(word) ? ' (' + base + ')' : ''}`, mean); hit = true; break; }
  const vs = (n.v || []).filter(v => lc(v[0]) === w);
  if (vs.length) { const [word, lemma, form, why] = vs[Math.min(occ, vs.length - 1)]; h += aiSec('Verb', 'var(--g-line)', `${word} ← ${lemma} · ${form}`, why); hit = true; }
  const os = (n.o || []).filter(o => lc(o[3] || o[0]) === w);
  if (os.length) { const [word, kind, ref] = os[Math.min(occ, os.length - 1)]; h += aiSec(kind === 'DO' ? 'Direct object' : 'Indirect object', `var(--${kind === 'DO' ? 'od' : 'oi'})`, word + (os[Math.min(occ, os.length - 1)][3] ? ` (in ${os[Math.min(occ, os.length - 1)][3]})` : ''), ref); hit = hasO = true; }
  for (const [name, words, d] of n.g || []) if (words.some(x => lc(x) === w)) { h += aiSec('Grammar', 'var(--g-line)', name, d); hit = true; }
  for (const [ph, base, mean] of n.x || []) if (hasWord(ph.replace(/[¡!¿?.,]/g, ''), w)) { h += aiSec('Expression', 'var(--c-line)', ph + (base && lc(base) !== lc(ph) ? ' → ' + base : ''), mean); hit = true; }
  if (!hit) h += `<div class="desc" style="color:var(--muted);font-size:13px;margin-top:6px">这个词没有单独的精讲，点"Whole sentence notes"看整句。</div>`;
  return { html: h, hasO };
}
function renderAiSentence(si) {
  const n = AI && AI.s[si]; if (!n) return;
  let h = '<div class="grab"></div>';
  h += `<h2 style="font-size:1.05em;line-height:1.4">${esc(sentText(si))}</h2>`;
  h += aiSec('Translation', 'var(--accent)', '', n.tr);
  if (n.k && n.k.length) h += `<div class="sec ai"><div class="lbl">Key words</div>${n.k.map(([w, l, m]) => `<div class="desc"><b>${esc(w)}</b>${l && lc(l) !== lc(w) ? ' <span style="color:var(--muted)">(' + esc(l) + ')</span>' : ''} — ${esc(m)}</div>`).join('')}</div>`;
  if (n.v && n.v.length) h += `<div class="sec ai"><div class="lbl"><i style="background:var(--g-line)"></i>Verbs</div>${n.v.map(([w, l, f, y]) => `<div class="desc"><b>${esc(w)}</b> ← ${esc(l)} · <i>${esc(f)}</i>${y ? '<br><span style="color:var(--muted)">' + esc(y) + '</span>' : ''}</div>`).join('')}</div>`;
  if (n.o && n.o.length) h += `<div class="sec ai"><div class="lbl">Objects</div>${n.o.map(([w, k, r, hst]) => `<div class="desc"><b style="color:${k === 'DO' ? 'var(--c-line)' : '#9333ea'}">${esc(w)}</b>${hst ? ' <span style="color:var(--muted)">(in ' + esc(hst) + ')</span>' : ''} · ${k} — ${esc(r)}</div>`).join('')}</div>`;
  for (const [name, , d] of n.g || []) h += aiSec('Grammar', 'var(--g-line)', name, d);
  for (const [ph, base, mean] of n.x || []) h += aiSec('Expression', 'var(--c-line)', ph, mean);
  h += '<div class="acts">';
  if (lastWord) h += `<button data-act="backWord">← Back</button>`;
  h += `</div>`;
  openSheet(h);
}

function sentenceOf(pi, ti) {
  let r = -1;
  sentences.forEach((s, i) => { if (s.p < pi || (s.p === pi && s.t0 <= ti)) r = i; });
  return r;
}

function openSheet(html, keepScroll) {

/* ======================================================================
 * 动词变位表（web/conj.json，由 verbecc 生成；复合时态用 haber 拼出）
 * ==================================================================== */
let CONJ = null;
const PERS_L = ['yo', 'tú', 'él / ella / Ud.', 'nosotros', 'vosotros', 'ellos / Uds.'];
const IMP_L = ['tú', 'usted', 'nosotros', 'vosotros', 'ustedes'];
async function renderConj(verb, form) {
  if (!CONJ) { try { CONJ = await loadJSON('conj.json'); } catch { toast('变位表加载失败'); return; } }
  const base = /(ar|er|ir|ír)se$/.test(verb) ? verb.slice(0, -2) : verb;
  const v = CONJ[base];
  const back = lastWord ? '<button data-act="backWord">← Back</button>' : '';
  if (!v) {
    openSheet(`<div class="grab"></div><h2>${esc(verb)}</h2><div class="desc">No conjugation table for this word.</div><div class="acts">${back}</div>`);
    return;
  }
  const hb = CONJ.haber.f, f = v.f;
  const target = (form || '').toLowerCase();
  const card = (title, labels, forms, prefix) => {
    let h = `<div class="cj"><b>${title}</b>`;
    forms.forEach((x, i) => {
      const full = (prefix ? prefix[i] + ' ' : '') + x;
      const hit = x && target && (x.toLowerCase().split(' / ').includes(target) || full.toLowerCase() === target);
      h += `<div class="${hit ? 'hit' : ''}"><i>${labels[i]}</i><span>${esc(full || '—')}</span></div>`;
    });
    return h + '</div>';
  };
  const comp = (title, aux) => card(title, PERS_L, aux.map(a => a + ' ' + v.pp));
  let h = `<div class="grab"></div><h2>${esc(base)}${verb !== base ? `<span class="lemma">(${esc(verb)})</span>` : ''}</h2>`;
  const nf = x => `<b style="color:var(--fg)${x && x.toLowerCase() === target ? ';background:var(--target);border-radius:4px;padding:0 3px' : ''}">${esc(x)}</b>`;
  h += `<div class="desc" style="font-size:14px;color:var(--muted)">gerund ${nf(v.g)} · past participle ${nf(v.pp)}${v.tpl && v.tpl !== base ? ` · conjugates like <b style="color:var(--fg)">${esc(v.tpl)}</b>` : ''}</div>`;
  if (v.pred) h += `<div class="desc" style="font-size:13px;color:#b45309;margin-top:4px">This verb is not in the reference list; forms were generated by pattern and may contain mistakes.</div>`;
  h += '<div class="cj-h">INDICATIVE</div><div class="cj-grid">' +
    card('Present', PERS_L, f.ip) + card('Preterite', PERS_L, f.is) + card('Imperfect', PERS_L, f.ii) +
    card('Future', PERS_L, f.if) + card('Conditional', PERS_L, f.cp) + '</div>';
  h += '<div class="cj-h">SUBJUNCTIVE</div><div class="cj-grid">' +
    card('Present', PERS_L, f.sp) + card('Imperfect (-ra)', PERS_L, f.si) + card('Imperfect (-se)', PERS_L, f.si2) + '</div>';
  h += '<div class="cj-h">IMPERATIVE</div><div class="cj-grid">' +
    card('Affirmative', IMP_L, f.ia) + card('Negative', IMP_L, f.in) + '</div>';
  h += '<div class="cj-h">COMPOUND TENSES (haber + participle)</div><div class="cj-grid">' +
    comp('Present perfect', hb.ip) + comp('Pluperfect', hb.ii) + comp('Future perfect', hb.if) +
    comp('Conditional perfect', hb.cp) + comp('Present perfect subj.', hb.sp) + comp('Pluperfect subj.', hb.si) + '</div>';
  h += `<div class="desc" style="font-size:12px;color:var(--muted);margin-top:12px">More: <a href="https://www.spanishdict.com/conjugate/${encodeURIComponent(base)}">SpanishDict ↗</a> · <a href="https://en.wiktionary.org/wiki/${encodeURIComponent(base)}#Spanish">Wiktionary ↗</a><br>Tables generated with verbecc (LGPL-3.0).</div>`;
  h += `<div class="acts">${back}</div>`;
  openSheet(h);
  const hit = $('sheet').querySelector('.hit');
  if (hit) setTimeout(() => hit.scrollIntoView({ block: 'center' }), 30);
}

function renderHelp() {
  const sec = (t, items) => `<div class="sec"><div class="lbl">${t}</div><div class="desc" style="font-size:14px">${items.map(x => '· ' + x).join('<br>')}</div></div>`;
  let h = '<div class="grab"></div><h2 style="font-size:19px;margin-bottom:4px">使用帮助</h2>';
  h += sec('播放', [
    "«10' ‹5' 5'› 10'»：后退 / 前进 10 秒、5 秒；中间是播放 / 暂停",
    '下面一排是倍速，点一下切换；进度条可以拖动',
    '锁屏或切到别的 App 继续播放，通知栏和耳机线控可以控制',
    '每集会记住播放进度和文本滚动位置',
  ]);
  h += sec('手动对齐', [
    '右上角「对齐」打开对齐模式，高亮的是正在听的句子，第一句从 0 秒开始',
    '这句说完时按「标记 ▸」，按下的时刻记为下一句的开始，高亮移到下一句',
    '撤销：取消上一次标记；−0.2s / +0.2s：微调刚标的分句点并从那里重播',
    '设置 → 清除本集对齐：需要确认两次，并输入 clear',
    '点任意句子：从那句接着标（最好选已经有开始时间的句子）',
    '标好的集：播放时高亮当前句并自动跟随滚动；手动滑动文本后会暂停跟随几秒',
  ]);
  h += sec('从某句开始播放（已对齐的句子）', [
    '点句首的 ▶',
    '长按句子里任意一个词（电脑上用右键）',
    '或者点词，在注释卡片里点 Play from this sentence',
  ]);
  h += sec('注释', [
    '点任意单词：原形、词性和英文释义、动词变位、语法结构、固定搭配、宾语',
    '点动词后按 Conjugation table：查看完整变位表，你点的那个形式会高亮；表下方有 SpanishDict / Wiktionary 链接',
    '橙色虚线下划线 = 语法结构；绿色下划线 = 固定搭配；绿底 / 紫底 = 直接 / 间接宾语（默认关闭）',
    '词尾颜色表示性数：<span style="color:var(--ms)">阳性单数</span>、<span style="color:var(--fs)">阴性单数</span>、<span style="color:var(--mp)">阳性复数</span>、<span style="color:var(--fp)">阴性复数</span>',
    '注释由程序自动生成，约九成准确；宾语指代是推测的',
    '各类标注都可以在设置里单独开关',
  ]);
  h += sec('备份', [
    '设置 → 导出：保存所有对齐时间和收听进度；换手机或重装前先导出',
    '设置 → 导入：恢复备份',
  ]);
  h += '<div class="acts"><button data-act="back">返回设置</button><button class="pri" data-act="close">完成</button></div>';
  openSheet(h);
}
$('settingsBtn').onclick = renderSettings;
$('listSettings').onclick = renderSettings;

function applyPrefs() {
  for (const l of LAYERS) document.body.classList.toggle('l-' + l.key, layerOn(l.key));
  document.body.classList.toggle('no-en', !layerOn('en'));
  document.documentElement.style.setProperty('--fs-size', store.get('fontSize', 19) + 'px');
}

function exportData() {
  const data = { app: 'esp_listen', version: 1, exported: new Date().toISOString(),
                 align: store.get('align', {}), progress: store.get('progress', {}) };
  const text = JSON.stringify(data);
  const name = `esp_listen_backup_${new Date().toISOString().slice(0, 10)}.json`;
  if (native && Android.exportText) { Android.exportText(name, text); return; }
  // 浏览器：尝试下载，同时显示文本可以复制
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click();
  } catch {}
  openSheet(`<div class="grab"></div><h2 style="font-size:18px">导出的数据</h2><div class="desc" style="font-size:13px;color:var(--muted)">如果没有自动下载，可以复制下面的内容保存。</div><textarea readonly>${esc(text)}</textarea><div class="acts"><button class="pri" data-act="copy">复制</button><button data-act="close">关闭</button></div>`);
}
window.onExportDone = ok => toast(ok ? '已导出' : '导出取消');

function importData() {
  if (native && Android.importText) { Android.importText(); return; }
  $('importInput').click();
}
$('importInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  window.onImportText(await f.text());
  e.target.value = '';
});
window.onImportText = text => {
  try {
    const d = JSON.parse(text);
    if (!d || d.app !== 'esp_listen') throw new Error('不是西语听力的备份文件');
    const al = store.get('align', {});
    let n = 0;
    for (const [k, arr] of Object.entries(d.align || {})) { al[k] = arr; n++; }
    store.set('align', al);
    if (d.progress) store.set('progress', Object.assign(store.get('progress', {}), d.progress));
    toast(`已导入 ${n} 集的对齐数据`);
    closeSheet(); renderList();
    if (current) renderText(current);
  } catch (err) { toast('导入失败：' + err.message); }
};

// 清除本集对齐：两次确认 + 输入 clear
function clearAlignStep1() {
  if (!current) return;
  const n = getAlign(current.n).filter(x => x != null).length;
  openSheet(`<div class="grab"></div><h2 style="font-size:18px">清除本集对齐？</h2>
    <div class="desc">将删除「${esc(pad(current.n) + ' ' + current.title)}」已标记的 ${n} 个时间，无法恢复。建议先在设置里导出备份。</div>
    <div class="acts"><button data-act="close">取消</button><button data-act="clearAlign2" style="color:#dc2626;border-color:#dc2626">继续</button></div>`);
}
function clearAlignStep2() {
  openSheet(`<div class="grab"></div><h2 style="font-size:18px">再次确认</h2>
    <div class="desc">请输入 <b>clear</b> 以确认清除：</div>
    <input id="clearInput" autocomplete="off" autocapitalize="off" spellcheck="false"
      style="width:100%;margin-top:10px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)">
    <div class="acts"><button data-act="close">取消</button><button id="clearDo" data-act="clearAlignDo" disabled
      style="background:#dc2626;border-color:#dc2626;color:#fff;opacity:.4">清除</button></div>`);
  const inp = $('clearInput'), btn = $('clearDo');
  inp.addEventListener('input', () => { const ok = inp.value.trim() === 'clear'; btn.disabled = !ok; btn.style.opacity = ok ? 1 : .4; });
  setTimeout(() => inp.focus(), 50);
}
function clearAlign() {
  if (!current) return;
  const all = store.get('align', {}); delete all[current.n]; store.set('align', all);
  toast('已清除本集的对齐（如有内置对齐会恢复内置的）'); closeSheet(); updateAlignUI();
}

/* ======================================================================
 * 对齐模式
 * ==================================================================== */
let alignTarget = 0;
const undoStack = [];

$('alignBtn').onclick = () => {
  if (!sentences.length) { toast('这一集没有可以对齐的句子'); return; }
  const on = !document.body.classList.contains('align');
  document.body.classList.toggle('align', on);
  $('alignBtn').classList.toggle('on', on);
  if (on) {
    const al = getAlign(current.n);
    // 目标 = 正在听的句子：第一个「下一句还没有开始时间」的句子
    let first = sentences.findIndex((_, i) => i + 1 < sentences.length && al[i + 1] == null);
    if (first < 0) first = 0;
    setTarget(first);
  } else {
    sentences.forEach(s => s.el && s.el.classList.remove('target'));
  }
  updateAlignUI();
};

function setTarget(i) {
  if (!sentences.length) return;
  alignTarget = Math.max(0, Math.min(sentences.length - 1, i));
  sentences.forEach((s, k) => s.el && s.el.classList.toggle('target', k === alignTarget));
  const el = sentences[alignTarget].el;
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  updateAlignUI();
}

// 在高亮句说完时按：当前时间 = 下一句的开始时间，然后高亮移到下一句
$('markBtn').onclick = () => {
  const s = player.state(); if (!s || !s.dur) { toast('先开始播放音频'); return; }
  if (alignTarget >= sentences.length - 1) { toast('已经是最后一句了'); return; }
  const al = getAlign(current.n);
  while (al.length < sentences.length) al.push(null);
  const next = alignTarget + 1;
  const t = Math.max(0, s.pos);                 // 就取按下的时刻
  undoStack.push({ i: next, prev: al[next], prev0: al[0], from: alignTarget });
  if (al[0] == null) al[0] = 0;                 // 第一句默认从 0 秒开始
  al[next] = t;
  // 重新标注时清掉前后矛盾的时间
  for (let k = next + 1; k < al.length; k++) if (al[k] != null && al[k] < t) al[k] = null;
  for (let k = 1; k < next; k++) if (al[k] != null && al[k] > t) al[k] = null;
  setAlign(current.n, al);
  setTarget(next);
};
$('undoBtn').onclick = () => {
  const u = undoStack.pop(); if (!u) { toast('没有可以撤销的'); return; }
  const al = getAlign(current.n); al[u.i] = u.prev; al[0] = u.prev0; setAlign(current.n, al);
  setTarget(u.from);
};
function nudge(ms) {
  const al = getAlign(current.n);
  // 微调：调整「上一个刚标记的句子」；如果当前目标句已经有时间，就调整它
  const i = al[alignTarget] != null ? alignTarget : (undoStack.length ? undoStack[undoStack.length - 1].i : alignTarget);
  if (al[i] == null) { toast('这一句还没有标记'); return; }
  al[i] = Math.max(0, al[i] + ms); setAlign(current.n, al);
  player.seekTo(al[i]); player.play();
  toast(`第 ${i + 1} 句：${fmt1(al[i])}`, 900);
  updateAlignUI();
}
$('nudgeBack').onclick = () => nudge(-200);
$('nudgeFwd').onclick = () => nudge(200);

function updateAlignUI() {
  if (!current) return;
  const al = getAlign(current.n);
  let done = 0;
  sentences.forEach((s, i) => { const ok = al[i] != null; if (ok) done++; if (s.el) s.el.classList.toggle('done', ok); });
  const tgt = al[alignTarget];
  $('alignInfo').textContent = sentences.length
    ? `已对齐 ${done} / ${sentences.length} 句 · 正在听第 ${alignTarget + 1} 句${tgt != null ? '（开始于 ' + fmt1(tgt) + '）' : ''}`
    : '';
}

/** 播放时根据对齐数据找当前句 */
function sentenceAt(pos) {
  const al = getAlign(current.n);
  let best = -1, bestT = -1;
  for (let i = 0; i < al.length; i++) {
    const t = al[i];
    if (t != null && t <= pos + 50 && t >= bestT) { best = i; bestT = t; }
  }
  return best;
}
function highlightSentence() {
  if (!current || !sentences.length || document.body.classList.contains('align')) return;
  const i = sentenceAt(st.pos);
  if (i === curSent) return;
  if (curSent >= 0 && sentences[curSent] && sentences[curSent].el) sentences[curSent].el.classList.remove('cur');
  curSent = i;
  if (i < 0 || !sentences[i].el) return;
  const el = sentences[i].el;
  el.classList.add('cur');
  if (layerOn('follow') && Date.now() > userScrollUntil && st.playing) {
    const box = $('text').getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.top < box.top + 40 || r.bottom > box.bottom - 40) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

/* ======================================================================
 * 页面切换、播放控制
 * ==================================================================== */
function showPlayer(on) {
  $('playerScreen').classList.toggle('hidden', !on);
  $('listScreen').classList.toggle('hidden', on);
  if (!on) {
    document.body.classList.remove('align'); $('alignBtn').classList.remove('on');
    closeSheet(); renderList(); updateMini();
  }
}
$('backBtn').onclick = () => showPlayer(false);
window.appBack = () => {
  if (!$('sheet').classList.contains('hidden')) { closeSheet(); return true; }
  if (document.body.classList.contains('align')) { $('alignBtn').click(); return true; }
  if (!$('playerScreen').classList.contains('hidden')) { showPlayer(false); return true; }
  return false;
};

$('play').onclick = () => { player.toggle(); setTimeout(poll, 60); };
document.querySelectorAll('[data-skip]').forEach(b => {
  b.onclick = () => {
    const sec = +b.dataset.skip;
    player.seekBy(sec * 1000);
    toast((sec > 0 ? '+' : '') + sec + "'", 500);
    setTimeout(poll, 60);
  };
});
SPEEDS.forEach(x => {
  const b = document.createElement('button');
  b.textContent = x + '×'; b.dataset.speed = x;
  b.onclick = () => setSpeed(x);
  $('speedRow').append(b);
});
function setSpeed(x) {
  player.speed(x); store.set('speed', x);
  document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === x));
}

const seekEl = $('seek');
seekEl.addEventListener('input', () => { seeking = true; $('cur').textContent = fmt(seekEl.value / 1000 * st.dur); });
seekEl.addEventListener('change', () => { player.seekTo(seekEl.value / 1000 * st.dur); seeking = false; setTimeout(poll, 60); });

function updateMini() {
  const show = current && st.dur > 0;
  $('mini').classList.toggle('hidden', !show);
  if (show) { $('miniTitle').textContent = pad(current.n) + ' ' + current.title; $('miniPlay').textContent = st.playing ? '❚❚' : '▶'; }
}
$('mini').onclick = e => { if (e.target.id !== 'miniPlay' && current) openEpisode(current); };
$('miniPlay').onclick = () => { player.toggle(); setTimeout(poll, 60); };

function poll() {
  const s = player.state();
  if (!s) return;
  st = s;
  $('play').textContent = s.playing ? '❚❚' : '▶';
  if (!seeking) {
    $('cur').textContent = fmt(s.pos);
    $('dur').textContent = fmt(s.dur);
    seekEl.value = s.dur ? Math.round(s.pos / s.dur * 1000) : 0;
  }
  if (!$('listScreen').classList.contains('hidden')) updateMini();
  else highlightSentence();
}
let lastSave = 0;
function saveProgress(done) {
  if (!current || !st.dur) return;
  const prog = store.get('progress', {});
  const old = prog[current.n] || {};
  prog[current.n] = { pos: Math.round(st.pos), dur: Math.round(st.dur), done: done || old.done || st.pos > st.dur - 15000 };
  store.set('progress', prog);
}
setInterval(() => {
  poll();
  const now = Date.now();
  if (st.playing && now - lastSave > 5000) { lastSave = now; saveProgress(false); }
}, 200);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(false); });

let toastTimer = 0;
function toast(t, ms = 1500) {
  const m = $('msg'); m.textContent = t; m.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove('show'), ms);
}

/* ======================================================================
 * 启动
 * ==================================================================== */
(async function init() {
  applyPrefs();
  setSpeed(store.get('speed', 1));
  try {
    EPISODES = (await loadJSON('transcripts.json')).episodes;
  } catch (e) {
    $('list').textContent = '读取文本数据失败：' + e;
    return;
  }
  try { BUILTIN_ALIGN = await loadJSON('align.json'); } catch { BUILTIN_ALIGN = {}; }
  refreshAudio();
  const s = player.state();
  if (native && s && s.name) {
    const m = s.name.match(/\[([A-Za-z0-9_-]{11})\]/);
    const e = m && EPISODES.find(x => x.yt === m[1]);
    if (e) { current = e; st = s; updateMini(); }
  }
})();
</script>
</body>
